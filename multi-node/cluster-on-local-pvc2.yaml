apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  # network:
    # provider: host
  # security:
  # # Settings to enable key rotation for KEK(Key Encryption Key).
  # # Currently, this is supported only for the default encryption type,
  # # using kubernetes secrets.
  #   keyRotation:
  #     enabled: true
  #     # The schedule, written in [cron format](https://en.wikipedia.org/wiki/Cron),
  #     # with which key rotation [CronJob](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/)
  #     # is created. The default value is `"@weekly"`.
  #     schedule: "@monthly"
  #   # To enable the KMS configuration properly don't forget to uncomment the Secret at the end of the file
  #   kms:
  #     # name of the config map containing all the kms connection details
  #     connectionDetails:
  #       KMS_PROVIDER: "vault"
  #       VAULT_ADDR: http://vault.default.svc.cluster.local:8200 
  #       VAULT_BACKEND_PATH: "rook"
  #       VAULT_SECRET_ENGINE: "kv-v2"
  #     # name of the secret containing the kms authentication token
  #     tokenSecretName: rook-vault-token
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: false
    # volumeClaimTemplate:
    #   spec:
    #     storageClassName: local-storage
    #     resources:
    #       requests:
    #         storage: 10Gi
  cephVersion:
    # image: quay.ceph.io/ceph-ci/ceph:main
    # image: quay.io/ceph/ceph:v19.2.1
    image: quay.io/ceph/ceph:v18.2.0
    # image: quay.io/guits/ceph-volume:bs-rdr
    allowUnsupported: true
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: pg_autoscaler
        enabled: true
      - name: prometheus
        enabled: true
  monitoring:
    enabled: false
  dashboard:
    enabled: false
    ssl: false
  crashCollector:
    disable: false
  storage:
    migration:
      confirmation: "yes-really-migrate-osds"
    store: 
      type: bluestore
    storageClassDeviceSets:
      - name: set1
        count: 1
        portable: false
        tuneDeviceClass: true
        tuneFastDeviceClass: false
        encrypted: true
        # placement:
        #   topologySpreadConstraints:
        #     - maxSkew: 1
        #       topologyKey: kubernetes.io/hostname
        #       whenUnsatisfiable: ScheduleAnyway
        #       labelSelector:
        #         matchExpressions:
        #           - key: app
        #             operator: In
        #             values:
        #               - rook-ceph-osd
        #               - rook-ceph-osd-prepare
        # preparePlacement:
        #   podAntiAffinity:
        #     preferredDuringSchedulingIgnoredDuringExecution:
        #       - weight: 100
        #         podAffinityTerm:
        #           labelSelector:
        #             matchExpressions:
        #               - key: app
        #                 operator: In
        #                 values:
        #                   - rook-ceph-osd
        #               - key: app
        #                 operator: In
        #                 values:
        #                   - rook-ceph-osd-prepare
        #           topologyKey: kubernetes.io/hostname
        resources:
        # These are the OSD daemon limits. For OSD prepare limits, see the separate section below for "prepareosd" resources
        #   limits:
        #     cpu: "500m"
        #     memory: "4Gi"
        #   requests:
        #     cpu: "500m"
        #     memory: "4Gi"
        volumeClaimTemplates:
          - metadata:
              name: data
              # if you are looking at giving your OSD a different CRUSH device class than the one detected by Ceph
              # annotations:
              #   crushDeviceClass: hybrid
            spec:
              resources:
                requests:
                  storage: 1
              # IMPORTANT: Change the storage class depending on your environment
              storageClassName: local-storage
              volumeMode: Block
              accessModes:
                - ReadWriteOnce
      - name: set2
        count: 1
        portable: false
        tuneDeviceClass: true
        tuneFastDeviceClass: false
        encrypted: true
        # placement:

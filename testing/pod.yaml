apiVersion: v1
kind: Pod
metadata:
  name: dapi-test-pod
spec:
  containers:
    - name: test-container
      image: registry.k8s.io/busybox:1.27.2
      command: ["/bin/sh", "-c", "env && sleep 2m"]
      env:
        - name: host
          valueFrom:
            configMapKeyRef:
              name: nodes-env
              key: $(spec.nodeName).host
              optional: true # mark the variable as optional
  restartPolicy: Never